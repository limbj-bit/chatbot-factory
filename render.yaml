services:
  - type: web
    name: chatbot-factory
    # Live service was created from the dashboard with the Python 3 runtime,
    # so this file was previously ignored (runtime: docker / autoDeploy: true
    # never applied). Keep it aligned with the live service instead.
    runtime: python
    plan: free
    branch: main
    # Manual deploys only (Trigger deploy in the dashboard), by explicit choice.
    autoDeploy: false
    healthCheckPath: /health
    # bump: drop Chromium from image (API/sale-span only on Free) 2026-10-30
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./chatbot_factory.db
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_VISION_MODEL
        sync: false
