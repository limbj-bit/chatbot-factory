services:
  - type: web
    name: chatbot-factory
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    # bump: Playwright Chromium for Cafe24 price enrich 2026-10-30
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./chatbot_factory.db
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_VISION_MODEL
        sync: false
