<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>챗봇공장 마스터 관리실 · Executive Admin Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: radial-gradient(circle at 20% 0%, #1F1E1B 0%, #121210 60%, #0A0A09 100%);
      color: #F8F6F2;
      min-height: 100vh;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #181816;
      padding: 36px;
      border-radius: 22px;
      border: 1px solid rgba(197, 160, 89, 0.35);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      border-bottom: 1px solid rgba(197, 160, 89, 0.25);
      padding-bottom: 20px;
      margin-bottom: 24px;
    }
    h1 { margin: 4px 0 0; font-size: 24px; color: #FFFFFF; font-weight: 800; letter-spacing: -0.4px; }
    .badge {
      display: inline-block;
      background: rgba(197, 160, 89, 0.18);
      color: #F3DFB6;
      border: 1px solid rgba(197, 160, 89, 0.5);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .auth-box {
      display: flex;
      gap: 10px;
      align-items: center;
      background: #111110;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid rgba(197, 160, 89, 0.45);
      margin-bottom: 22px;
    }
    .auth-box input {
      flex: 1;
      background: #1E1D1B;
      border: 1px solid #3F3C36;
      color: #F3DFB6;
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
    }
    .btn {
      background: linear-gradient(135deg, #C5A059 0%, #9E7B36 100%);
      color: #111110;
      border: none;
      padding: 10px 18px;
      border-radius: 9px;
      font-weight: 800;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.18s ease;
    }
    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-green { background: #059669; color: #FFFFFF; }
    .btn-purple { background: #7C3AED; color: #FFFFFF; }
    .btn-red { background: #DC2626; color: #FFFFFF; }
    .store-card {
      background: #111110;
      border: 1px solid #2E2C28;
      border-radius: 16px;
      padding: 18px 20px;
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      transition: border-color 0.2s ease;
    }
    .store-card:hover { border-color: rgba(197, 160, 89, 0.5); }
    .status-pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
    }
    .status-ok { background: #064E3B; color: #6EE7B7; }
    .status-warn { background: #78350F; color: #FDE68A; }
    .status-exp { background: #7F1D1D; color: #FCA5A5; }
    code {
      display: block;
      background: #080807;
      color: #F3DFB6;
      border: 1px solid #2E2C28;
      padding: 9px 13px;
      border-radius: 8px;
      font-size: 12px;
      margin-top: 8px;
    }
    a.showroom-link {
      color: #F3DFB6;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(197, 160, 89, 0.45);
      padding: 8px 15px;
      border-radius: 999px;
      background: rgba(197, 160, 89, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div>
        <div class="badge">MASTER ADMIN CONSOLE · ZERO-HOLE SECURITY</div>
        <h1>🔐 챗봇공장 공장장 전용 마스터 관리실</h1>
      </div>
      <a href="/showroom" class="showroom-link">🎨 고객용 셀프 디자인 쇼룸 보러가기 &rarr;</a>
    </div>

    <div class="auth-box">
      <span>🔑 <b>관리자 비밀번호:</b></span>
      <input type="password" id="adminKeyInput" value="chatbot123" placeholder="관리자 비밀번호 입력 (chatbot123)" />
      <button class="btn" onclick="loadAllStores()">🔓 스토어 전체 목록 조회</button>
    </div>

    <div id="authMessage" style="font-size:13px;color:#F87171;margin-bottom:10px;"></div>
    <div id="adminStoreList"></div>
  </div>

  <script>
    function getAdminHeaders() {
      const key = document.getElementById("adminKeyInput").value.trim();
      return {
        "Content-Type": "application/json",
        "X-Admin-Key": key
      };
    }

    async function loadAllStores() {
      const msgEl = document.getElementById("authMessage");
      const listEl = document.getElementById("adminStoreList");
      msgEl.innerText = "";

      const res = await fetch("/api/admin/stores", {
        headers: getAdminHeaders()
      });

      if (res.status === 401 || res.status === 403) {
        msgEl.innerText = "⛔ 관리자 비밀키(X-Admin-Key)가 일치하지 않습니다! 접근이 차단되었습니다.";
        listEl.innerHTML = "";
        return;
      }

      const stores = await res.json();
      if (!stores.length) {
        listEl.innerHTML = "<p style='color:#94A3B8;'>아직 생성된 스토어가 없습니다.</p>";
        return;
      }

      listEl.innerHTML = stores.map(s => {
        let pillClass = "status-ok";
        if (s.is_expired) pillClass = "status-exp";
        else if (s.expiry_warning) pillClass = "status-warn";

        const fullScript = `<script src="${window.location.origin}/api/widget/script?mall_id=${s.mall_id}" async><\/script>`;
        return `
          <div class="store-card">
            <div style="flex:1;min-width:280px;">
              <strong style="font-size:15px;">[${s.brand_badge}] ${s.store_name}</strong>
              <span style="color:#94A3B8;font-size:13px;">(몰ID: ${s.mall_id} / 봇이름: ${s.bot_name})</span>
              <span class="status-pill ${pillClass}">${s.status_message}</span>
              <div style="font-size:12px;color:#CBD5E1;margin-top:6px;">
                🪟 템플릿: <b>${s.chat_template}</b> | 🎨 아이콘: <b>${s.bot_icon_style}</b> (${s.launcher_shape}) |
                📊 일일 AI 쿼터: <b>${s.daily_quota_used} / ${s.daily_quota_limit}건</b> |
                🔒 허용 도메인: <b>${s.allowed_domains || "전체(*)"}</b>
              </div>
              <code>${fullScript.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="btn" onclick="updateSub('${s.mall_id}', { reset_days: 30, plan_type: 'active', is_active: true })">🔄 오늘부터 30일로 전환(무제한 해제)</button>
              <button class="btn btn-green" onclick="updateSub('${s.mall_id}', { extend_days: 30, plan_type: 'active', is_active: true })">➕ +30일 연장</button>
              <button class="btn btn-purple" onclick="updateSub('${s.mall_id}', { plan_type: 'unlimited', is_active: true })">👑 무제한 VIP 전환</button>
              <button class="btn btn-red" onclick="updateSub('${s.mall_id}', { plan_type: 'suspended', is_active: false })">⛔ 일시 정지</button>
            </div>
          </div>
        `;
      }).join("");
    }

    async function updateSub(mallId, payload) {
      const res = await fetch(`/api/admin/stores/${mallId}/subscription`, {
        method: "PATCH",
        headers: getAdminHeaders(),
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        alert("권한 오류: 관리자 비밀키를 확인하세요.");
        return;
      }
      await loadAllStores();
    }

    loadAllStores();
  </script>
</body>
</html>
