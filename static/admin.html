<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>챗봇공장 마스터 관리자 콘솔 (Admin Only)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 36px 20px;
      background: #0F172A;
      color: #F8FAFC;
    }
    .container {
      max-width: 1080px;
      margin: 0 auto;
      background: #1E293B;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #334155;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 1px solid #334155;
      padding-bottom: 18px;
      margin-bottom: 22px;
    }
    h1 { margin: 0; font-size: 22px; color: #F8FAFC; }
    .badge {
      display: inline-block;
      background: #0284C7;
      color: #FFFFFF;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .auth-box {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #0F172A;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #38BDF8;
      margin-bottom: 20px;
    }
    .auth-box input {
      flex: 1;
      background: #1E293B;
      border: 1px solid #475569;
      color: #FFFFFF;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 14px;
    }
    .btn {
      background: #0284C7;
      color: #FFFFFF;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-green { background: #059669; }
    .btn-purple { background: #7C3AED; }
    .btn-red { background: #DC2626; }
    .store-card {
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .status-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
    }
    .status-ok { background: #064E3B; color: #6EE7B7; }
    .status-warn { background: #78350F; color: #FDE68A; }
    .status-exp { background: #7F1D1D; color: #FCA5A5; }
    code {
      display: block;
      background: #020617;
      color: #38BDF8;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 8px;
    }
    a.showroom-link {
      color: #38BDF8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div>
        <div class="badge">MASTER ADMIN CONSOLE · ZERO-HOLE SECURITY</div>
        <h1>🔐 챗봇공장 공장장 전용 마스터 관리실</h1>
      </div>
      <a href="/showroom" class="showroom-link">🎨 고객용 셀프 디자인 쇼룸 보러가기 &rarr;</a>
    </div>

    <div class="auth-box">
      <span>🔑 <b>관리자 비밀키(ADMIN_API_KEY):</b></span>
      <input type="password" id="adminKeyInput" value="cosraw-master-2026" placeholder="설정한 ADMIN_API_KEY 입력..." />
      <button class="btn" onclick="loadAllStores()">🔓 스토어 전체 목록 조회</button>
    </div>

    <div id="authMessage" style="font-size:13px;color:#F87171;margin-bottom:10px;"></div>
    <div id="adminStoreList"></div>
  </div>

  <script>
    function getAdminHeaders() {
      const key = document.getElementById("adminKeyInput").value.trim();
      return {
        "Content-Type": "application/json",
        "X-Admin-Key": key
      };
    }

    async function loadAllStores() {
      const msgEl = document.getElementById("authMessage");
      const listEl = document.getElementById("adminStoreList");
      msgEl.innerText = "";

      const res = await fetch("/api/admin/stores", {
        headers: getAdminHeaders()
      });

      if (res.status === 401 || res.status === 403) {
        msgEl.innerText = "⛔ 관리자 비밀키(X-Admin-Key)가 일치하지 않습니다! 접근이 차단되었습니다.";
        listEl.innerHTML = "";
        return;
      }

      const stores = await res.json();
      if (!stores.length) {
        listEl.innerHTML = "<p style='color:#94A3B8;'>아직 생성된 스토어가 없습니다.</p>";
        return;
      }

      listEl.innerHTML = stores.map(s => {
        let pillClass = "status-ok";
        if (s.is_expired) pillClass = "status-exp";
        else if (s.expiry_warning) pillClass = "status-warn";

        const fullScript = `<script src="${window.location.origin}/api/widget/script?mall_id=${s.mall_id}" async><\/script>`;
        return `
          <div class="store-card">
            <div style="flex:1;min-width:280px;">
              <strong style="font-size:15px;">[${s.brand_badge}] ${s.store_name}</strong>
              <span style="color:#94A3B8;font-size:13px;">(몰ID: ${s.mall_id} / 봇이름: ${s.bot_name})</span>
              <span class="status-pill ${pillClass}">${s.status_message}</span>
              <div style="font-size:12px;color:#CBD5E1;margin-top:6px;">
                🪟 템플릿: <b>${s.chat_template}</b> | 🎨 아이콘: <b>${s.bot_icon_style}</b> (${s.launcher_shape}) |
                📊 일일 AI 쿼터: <b>${s.daily_quota_used} / ${s.daily_quota_limit}건</b> |
                🔒 허용 도메인: <b>${s.allowed_domains || "전체(*)"}</b>
              </div>
              <code>${fullScript.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="btn" onclick="updateSub('${s.mall_id}', { reset_days: 30, plan_type: 'active', is_active: true })">🔄 오늘부터 30일로 전환(무제한 해제)</button>
              <button class="btn btn-green" onclick="updateSub('${s.mall_id}', { extend_days: 30, plan_type: 'active', is_active: true })">➕ +30일 연장</button>
              <button class="btn btn-purple" onclick="updateSub('${s.mall_id}', { plan_type: 'unlimited', is_active: true })">👑 무제한 VIP 전환</button>
              <button class="btn btn-red" onclick="updateSub('${s.mall_id}', { plan_type: 'suspended', is_active: false })">⛔ 일시 정지</button>
            </div>
          </div>
        `;
      }).join("");
    }

    async function updateSub(mallId, payload) {
      const res = await fetch(`/api/admin/stores/${mallId}/subscription`, {
        method: "PATCH",
        headers: getAdminHeaders(),
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        alert("권한 오류: 관리자 비밀키를 확인하세요.");
        return;
      }
      await loadAllStores();
    }

    loadAllStores();
  </script>
</body>
</html>
