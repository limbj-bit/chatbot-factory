<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>챗봇공장 마스터 관리실 · Executive Admin Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: radial-gradient(circle at 20% 0%, #FFFFFF 0%, #FDFBF7 55%, #F6F1E6 100%);
      color: #1E293B;
      min-height: 100vh;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #FFFFFF;
      padding: 36px;
      border-radius: 22px;
      border: 1.5px solid #EFE6D5;
      box-shadow: 0 24px 60px rgba(180, 150, 95, 0.12);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      border-bottom: 1.5px solid #F2DFB6;
      padding-bottom: 20px;
      margin-bottom: 24px;
    }
    h1 { margin: 4px 0 0; font-size: 24px; color: #1E293B; font-weight: 800; letter-spacing: -0.4px; }
    .badge {
      display: inline-block;
      background: linear-gradient(90deg, #FEF4DC 0%, #FDECF3 100%);
      color: #9A6412;
      border: 1px solid #F1D293;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .auth-box {
      display: flex;
      gap: 10px;
      align-items: center;
      background: #FFFDF9;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1.5px solid #F2DFB6;
      margin-bottom: 22px;
    }
    .auth-box input {
      flex: 1;
      background: #FFFFFF;
      border: 1px solid #DCD7CD;
      color: #1E293B;
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
    }
    .btn {
      background: linear-gradient(135deg, #D97706 0%, #B45309 100%);
      color: #FFFFFF;
      border: none;
      padding: 10px 18px;
      border-radius: 9px;
      font-weight: 800;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.18s ease;
    }
    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-green { background: #059669; color: #FFFFFF; }
    .btn-purple { background: #7C3AED; color: #FFFFFF; }
    .btn-red { background: #DC2626; color: #FFFFFF; }
    .store-card {
      background: #FFFEFA;
      border: 1.5px solid #EAE5DC;
      border-radius: 16px;
      padding: 18px 20px;
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .store-card:hover { border-color: #D49B35; box-shadow: 0 8px 22px rgba(212, 155, 53, 0.10); }
    .status-pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
    }
    .status-ok { background: #D1FAE5; color: #065F46; }
    .status-warn { background: #FEF3C7; color: #92400E; }
    .status-exp { background: #FEE2E2; color: #991B1B; }
    code {
      display: block;
      background: #FFF9EB;
      color: #92400E;
      border: 1px solid #F2DFB6;
      padding: 9px 13px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 8px;
    }
    a.showroom-link {
      color: #855814;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      border: 1.5px solid #E8CA8C;
      padding: 8px 15px;
      border-radius: 999px;
      background: #FFFDF9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div>
        <div class="badge">MASTER ADMIN CONSOLE · ZERO-HOLE SECURITY</div>
        <h1>🔐 챗봇공장 공장장 전용 마스터 관리실</h1>
      </div>
      <a href="/showroom" class="showroom-link">🎨 고객용 셀프 디자인 쇼룸 보러가기 &rarr;</a>
    </div>

    <div class="auth-box">
      <span>🔑 <b>관리자 비밀번호:</b></span>
      <input type="password" id="adminKeyInput" value="" placeholder="ADMIN_API_KEY 입력" />
      <button class="btn" onclick="loadAllStores()">🔓 스토어 전체 목록 조회</button>
    </div>

    <div id="authMessage" style="font-size:13px;color:#F87171;margin-bottom:10px;"></div>
    <div style="margin-bottom:14px;display:flex;gap:10px;align-items:center;">
      <input type="text" id="adminSearchInput" placeholder="검색: 스토어명, mall_id, 봇이름, 업종..." style="flex:1;padding:10px 14px;border:1.5px solid #DCD7CD;border-radius:9px;font-size:13.5px;" oninput="filterStores()" />
    </div>
    <div id="adminStoreList"></div>
  </div>

  <script>
    function getAdminHeaders() {
      const key = document.getElementById("adminKeyInput").value.trim();
      return {
        "Content-Type": "application/json",
        "X-Admin-Key": key
      };
    }

    async function loadAllStores() {
      const msgEl = document.getElementById("authMessage");
      const listEl = document.getElementById("adminStoreList");
      msgEl.innerText = "";

      const res = await fetch("/api/admin/stores", {
        headers: getAdminHeaders()
      });

      if (res.status === 401 || res.status === 403) {
        msgEl.innerText = "⛔ 관리자 비밀키(X-Admin-Key)가 일치하지 않습니다! 접근이 차단되었습니다.";
        listEl.innerHTML = "";
        return;
      }

      const stores = await res.json();
      if (!stores.length) {
        listEl.innerHTML = "<p style='color:#94A3B8;'>아직 생성된 스토어가 없습니다.</p>";
        return;
      }

      listEl.innerHTML = stores.map(s => {
        let pillClass = "status-ok";
        if (s.is_expired) pillClass = "status-exp";
        else if (s.expiry_warning) pillClass = "status-warn";

        const fullScript = `<script src="${window.location.origin}/api/widget/script?mall_id=${s.mall_id}" async><\/script>`;
        return `
          <div class="store-card">
            <div style="flex:1;min-width:280px;">
              <strong style="font-size:15px;color:#1E293B;">[${s.brand_badge}] ${s.store_name}</strong>
              <span style="color:#64748B;font-size:13px;">(몰ID: ${s.mall_id} / 봇이름: ${s.bot_name})</span>
              <span class="status-pill ${pillClass}">${s.status_message}</span>
              <div style="font-size:12px;color:#475569;margin-top:6px;">
                🪟 템플릿: <b>${s.chat_template}</b> | 🎨 아이콘: <b>${s.bot_icon_style}</b> (${s.launcher_shape}) |
                📊 일일 AI 쿼터: <b>${s.daily_quota_used} / ${s.daily_quota_limit}건</b> |
                🔌 API 연동: <b>${s.commerce_api_Connected ? (s.commerce_platform + " (" + (s.commerce_store_uid || "연동됨") + ")") : "기본모드(미연동)"}</b> |
                📱 직통링크: <a href="/chat/${s.mall_id}" target="_blank" style="color:#B45309;font-weight:700;">/chat/${s.mall_id}</a>
              </div>
              <code>${fullScript.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="btn" onclick="updateSub('${s.mall_id}', { reset_days: 30, plan_type: 'active', is_active: true })">🔄 오늘부터 30일로 전환(무제한 해제)</button>
              <button class="btn btn-green" onclick="updateSub('${s.mall_id}', { extend_days: 30, plan_type: 'active', is_active: true })">➕ +30일 연장</button>
              <button class="btn btn-purple" onclick="updateSub('${s.mall_id}', { plan_type: 'unlimited', is_active: true })">👑 무제한 VIP 전환</button>
              <button class="btn btn-red" onclick="updateSub('${s.mall_id}', { plan_type: 'suspended', is_active: false })">⛔ 일시 정지</button>
            </div>
          </div>
        `;
      }).join("");
    }

    async function updateSub(mallId, payload) {
      const res = await fetch(`/api/admin/stores/${mallId}/subscription`, {
        method: "PATCH",
        headers: getAdminHeaders(),
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        alert("권한 오류: 관리자 비밀키를 확인하세요.");
        return;
      }
      await loadAllStores();
    }

    let allStoresCache = [];

    async function loadAllStores() {
      const msgEl = document.getElementById("authMessage");
      const listEl = document.getElementById("adminStoreList");
      msgEl.innerText = "";

      const res = await fetch("/api/admin/stores", {
        headers: getAdminHeaders()
      });

      if (res.status === 401 || res.status === 403) {
        msgEl.innerText = "관리자 비밀번호(X-Admin-Key)가 일치하지 않습니다! 접근이 차단되었습니다.";
        listEl.innerHTML = "";
        return;
      }

      const stores = await res.json();
      allStoresCache = stores || [];
      renderStoreList(allStoresCache);
    }

    function renderStoreList(stores) {
      const listEl = document.getElementById("adminStoreList");
      if (!stores.length) {
        listEl.innerHTML = "<p style='color:#94A3B8;'>아직 생성된 스토어가 없습니다.</p>";
        return;
      }

      listEl.innerHTML = stores.map(s => {
        let pillClass = "status-ok";
        if (s.is_expired) pillClass = "status-exp";
        else if (s.expiry_warning) pillClass = "status-warn";

        const fullScript = `<script src="${window.location.origin}/api/widget/script?mall_id=${s.mall_id}" async><\/script>`;
        return `
          <div class="store-card">
            <div style="flex:1;min-width:280px;">
              <strong style="font-size:15px;color:#1E293B;">[${s.brand_badge}] ${s.store_name}</strong>
              <span style="color:#64748B;font-size:13px;">(몰ID: ${s.mall_id} / 봇이름: ${s.bot_name})</span>
              <button class="btn" style="padding:4px 10px;font-size:11px;margin-left:6px;" onclick="copyMallId('${s.mall_id}')">ID 복사</button>
              <span class="status-pill ${pillClass}">${s.status_message}</span>
              <div style="font-size:12px;color:#475569;margin-top:6px;">
                템플릿: <b>${s.chat_template}</b> | 아이콘: <b>${s.bot_icon_style}</b> (${s.launcher_shape}) |
                일일 AI 쿼터: <b>${s.daily_quota_used} / ${s.daily_quota_limit}건</b> |
                API 연동: <b>${s.commerce_api_Connected ? (s.commerce_platform + " (" + (s.commerce_store_uid || "연동됨") + ")") : "기본모드(미연동)"}</b> |
                직통링크: <a href="/chat/${s.mall_id}" target="_blank" style="color:#B45309;font-weight:700;">/chat/${s.mall_id}</a>
              </div>
              <code>${fullScript.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="btn" onclick="updateSub('${s.mall_id}', { reset_days: 30, plan_type: 'active', is_active: true })">오늘부로 30일로 변환</button>
              <button class="btn btn-green" onclick="updateSub('${s.mall_id}', { extend_days: 30, plan_type: 'active', is_active: true })">+30일 연장</button>
              <button class="btn btn-purple" onclick="updateSub('${s.mall_id}', { plan_type: 'unlimited', is_active: true })">무제한 VIP 변환</button>
              <button class="btn btn-red" onclick="updateSub('${s.mall_id}', { plan_type: 'suspended', is_active: false })">일시 정지</button>
               <button class="btn" style="background:#991B1B;color:#FFFFFF;" onclick="deleteStore('${s.mall_id}')">삭제</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function filterStores() {
      const q = (document.getElementById("adminSearchInput").value || "").trim().toLowerCase();
      if (!q) { renderStoreList(allStoresCache); return; }
      const filtered = allStoresCache.filter(s =>
        (s.store_name || "").toLowerCase().includes(q) ||
        (s.mall_id || "").toLowerCase().includes(q) ||
        (s.bot_name || "").toLowerCase().includes(q) ||
        (s.brand_badge || "").toLowerCase().includes(q) ||
        (s.industry || "").toLowerCase().includes(q)
      );
      renderStoreList(filtered);
    }

    function copyMallId(mallId) {
      navigator.clipboard.writeText(mallId).then(() => {
        alert("mall_id 복사됨: " + mallId);
      }).catch(() => {
        const ta = document.createElement("textarea");
        ta.value = mallId;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        alert("mall_id 복사됨: " + mallId);
      });
    }

    async function deleteStore(mallId) {
       if (!confirm("정말 삭제하시겠습니까? mall_id: " + mallId + "\n모든 학습 데이터와 설정이 삭제됩니다.")) return;
       const res = await fetch(`/api/admin/stores/${mallId}`, {
         method: "DELETE",
         headers: getAdminHeaders()
       });
       if (!res.ok) {
         alert("삭제 실패: " + (await res.text()));
         return;
       }
       alert("삭제 완료: " + mallId);
       await loadAllStores();
     }

     async function updateSub(mallId, payload) {
      const res = await fetch(`/api/admin/stores/${mallId}/subscription`, {
        method: "PATCH",
        headers: getAdminHeaders(),
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        alert("권한 오류: 관리자 비밀번호를 확인하세요.");
        return;
      }
      await loadAllStores();
    }

    loadAllStores();
  </script>
</body>
</html>
