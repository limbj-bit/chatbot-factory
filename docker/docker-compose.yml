version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fresh_claim_ai_app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/fresh_claims
      - REDIS_URL=redis://redis:6379/0
      - MOCK_AI=true
      - MOCK_CAFE24=true
      - ADMIN_API_KEY=admin-dev-secret-key-change-in-prod
      - POLICY_FULL_REFUND_DAMAGE_RATIO=30
      - POLICY_PARTIAL_REFUND_DAMAGE_RATIO=10
      - POLICY_MAX_CLAIM_DAYS=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - app_data:/app/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: fresh_claim_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fresh_claims
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fresh_claim_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  app_data:
